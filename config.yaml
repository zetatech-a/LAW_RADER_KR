# =========================================================================
# LAW_RADER_KR 설정 파일
#
# - 수신자, 발송 옵션, 모니터링 대상 사이트 목록을 정의합니다.
# - 민감정보(SMTP 비밀번호 등)는 여기 넣지 말고 환경변수/GitHub Secrets 로 주입합니다.
#   (필요 환경변수는 .env.example 참고)
# =========================================================================

email:
  # 수신자는 여기 적지 않습니다(주소가 저장소에 커밋되지 않도록).
  # GitHub Secrets(또는 로컬 .env)의 MAIL_TO 로 지정하세요.
  # 여러 명은 MAIL_TO 에 쉼표/세미콜론으로 구분. 수신자끼리는 서로 안 보입니다(BCC).
  recipients: []
  # 보내는 사람 표시 이름 (실제 발신 주소는 환경변수 MAIL_FROM / SMTP_USER 로 결정)
  # 메일함 목록에는 이 이름만, 클릭하면 "LAW RADER <krome000234@gmail.com>" 로 보입니다.
  from_name: "LAW RADER"
  # 메일 제목 접두어
  subject_prefix: "[LAW RADER]"
  # 한 통의 메일에 첨부파일을 붙일 총 용량 상한(MB). 초과분은 본문에 다운로드 링크로만 표시.
  max_attach_mb: 15

fetch:
  # 요청 사이 지연(초) - 서버 부하/차단 방지
  delay_sec: 1.0
  # 요청 타임아웃(초)
  timeout_sec: 30
  # 목록 한 페이지에서 상위 몇 개까지 볼지
  list_limit: 30
  # 한 번의 실행에서 이미 본 글 경계까지 훑을 최대 페이지 수(운영 시 따라잡기 상한).
  # 평상시엔 신규가 없거나 소수라 1~2페이지에서 곧 멈추므로 평상시 비용은 없다.
  max_pages: 10
  # 최초 기준선(baseline) 수립 시 기록할 페이지 수. 기준선은 '이미 있는 글을 신규로
  # 오인하지 않을' 만큼만 얕게 잡으면 되므로 작게 둔다(전체 아카이브를 훑지 않음).
  baseline_pages: 3
  # 한 소스에서 한 번에 발송/상세수집할 신규 상한(폭주 안전장치). 이를 초과하면
  # (상태 불일치 등 비정상 신호) 상세수집 없이 최신 이만큼만 발송하고 나머지는 seen 처리.
  max_new_per_source: 50

# -------------------------------------------------------------------------
# 모니터링 대상. 각 항목의 type 에 따라 src/scrapers 의 파서가 선택됩니다.
# enabled: false 로 두면 해당 소스를 건너뜁니다.
# -------------------------------------------------------------------------
sources:
  # ===== 금융위원회 (fsc.go.kr) =====
  - key: fsc_press
    name: "금융위 · 보도자료"
    type: fsc_board
    enabled: true
    list_url: "https://www.fsc.go.kr/no010101"

  - key: fsc_legislation
    name: "금융위 · 입법예고/규정변경예고"
    type: fsc_board
    enabled: true
    list_url: "https://www.fsc.go.kr/po040301"

  # ===== 금융감독원 (fss.or.kr) — eGovFrame 게시판 =====
  - key: fss_press
    name: "금감원 · 보도자료"
    type: fss_board
    enabled: true
    list_url: "https://www.fss.or.kr/fss/bbs/B0000188/list.do?menuNo=200218"

  - key: fss_admin_guidance
    name: "금감원 · 행정지도 예고"
    type: fss_board
    enabled: true
    list_url: "https://www.fss.or.kr/fss/job/admnPrvntc/list.do?menuNo=200491"

  - key: fss_rule_amendment
    name: "금감원 · 세칙 제·개정 예고"
    type: fss_board
    enabled: true
    list_url: "https://www.fss.or.kr/fss/job/lrgRegItnPrvntc/list.do?menuNo=200489"

  - key: fss_sanction
    name: "금감원 · 검사결과 제재"
    type: fss_board
    enabled: true
    list_url: "https://www.fss.or.kr/fss/job/openInfo/list.do?menuNo=200476"

  - key: fss_mgmt_notice
    name: "금감원 · 경영유의사항 등 공시"
    type: fss_board
    enabled: true
    list_url: "https://www.fss.or.kr/fss/job/openInfoImpr/list.do?menuNo=200483"

  # ===== 금융규제·법령해석포털 (better.fsc.go.kr) =====
  - key: better_reply
    name: "금융규제포털 · 법령해석·비조치의견서 회신사례"
    type: better_reply
    enabled: true
    list_url: "https://better.fsc.go.kr/fsc_new/replyCase/TotalReplyList.do?stNo=11&muNo=117&muGpNo=75"

  # ===== 의안정보시스템 (likms.assembly.go.kr) =====
  # 계류의안 목록은 열린국회정보(open.assembly.go.kr) Open API 로 수집합니다.
  # 인증키는 Secret/환경변수 ASSEMBLY_API_KEY 로 주입하세요.
  - key: assembly_bill
    name: "의안정보시스템 · 계류의안"
    type: assembly_bill
    enabled: true
    list_url: "https://likms.assembly.go.kr/bill/bi/bill/state/mooringBillPage.do"
    # 명세서 기준: '법률안 심사 및 처리(계류의안)' 서비스
    #   요청주소 .../portal/openapi/nwbqublzajtcqpdae
    #   출력필드: BILL_ID, BILL_NO, BILL_NAME, PROPOSER, RST_PROPOSER, PROPOSE_DT, LINK_URL 등
    #   (AGE 는 이 서비스의 요청인자가 아니라 보내도 무시됨 — 계류의안만 반환)
    api_endpoint: "https://open.assembly.go.kr/portal/openapi"
    api_service: "nwbqublzajtcqpdae"
    page_size: 100
