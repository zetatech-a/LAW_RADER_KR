# =========================================================================
# LAW_RADER_KR 설정 파일
#
# - 수신자, 발송 옵션, 모니터링 대상 사이트 목록을 정의합니다.
# - 민감정보(SMTP 비밀번호 등)는 여기 넣지 말고 환경변수/GitHub Secrets 로 주입합니다.
#   (필요 환경변수는 .env.example 참고)
# =========================================================================

email:
  # 수신자는 여기 적지 않습니다(주소가 저장소에 커밋되지 않도록).
  # GitHub Secrets(또는 로컬 .env)의 MAIL_TO 로 지정하세요.
  # 여러 명은 MAIL_TO 에 쉼표/세미콜론으로 구분. 수신자끼리는 서로 안 보입니다(BCC).
  recipients: []
  # 보내는 사람 표시 이름 (실제 발신 주소는 환경변수 MAIL_FROM / SMTP_USER 로 결정)
  # 메일함 목록에는 이 이름만, 클릭하면 "LAW RADER <sender@example.com>" 로 보입니다.
  from_name: "LAW RADER"
  # 메일 제목 접두어
  subject_prefix: "[LAW RADER]"
  # 한 통의 메일에 첨부파일을 붙일 총 용량 상한(MB). 초과분은 본문에 다운로드 링크로만 표시.
  max_attach_mb: 15

fetch:
  # 요청 사이 지연(초) - 서버 부하/차단 방지
  delay_sec: 1.0
  # 요청 타임아웃(초)
  timeout_sec: 30
  # 목록 한 페이지에서 상위 몇 개까지 볼지
  list_limit: 30
  # 한 번의 실행에서 이미 본 글 경계까지 훑을 최대 페이지 수(운영 시 따라잡기 상한).
  # 평상시엔 신규가 없거나 소수라 1~2페이지에서 곧 멈추므로 평상시 비용은 없다.
  max_pages: 10
  # 최초 기준선(baseline) 수립 시 기록할 페이지 수. 기준선은 '이미 있는 글을 신규로
  # 오인하지 않을' 만큼만 얕게 잡으면 되므로 작게 둔다(전체 아카이브를 훑지 않음).
  baseline_pages: 3
  # 한 소스에서 한 번에 발송/상세수집할 신규 상한(폭주 안전장치). 이를 초과하면
  # (상태 불일치 등 비정상 신호) 상세수집 없이 최신 이만큼만 발송하고 나머지는 seen 처리.
  max_new_per_source: 50

# -------------------------------------------------------------------------
# LLM 본문 요약 (Google Gemini API)
#
# 상세 본문이 있는 게시글(금융위·금감원)은 원문을 앞에서 자른 발췌 대신 LLM 이 만든
# 3줄 요약을 메일에 싣습니다. 계류의안은 '제안이유 및 주요내용'을 모아 아래
# assembly_batch 설정에 따라 여러 건을 한 번에 요약합니다(1건당 1회가 아님).
# API 키는 환경변수/Secret 의 GEMINI_API_KEY 로 주입하며,
# 키가 없거나 호출이 실패하면 자동으로 기존 원문 발췌로 되돌아갑니다(메일은 정상 발송).
# 무료 키 발급: https://aistudio.google.com/apikey
# -------------------------------------------------------------------------
llm:
  enabled: true
  # 기본 모델. 특정 버전(예: gemini-2.5-flash)을 박아두면 그 버전이 수명 종료되는
  # 날부터 전 요청이 404 로 죽으므로, 공식 'flash latest' alias 를 씁니다.
  #
  # 이 값은 환경변수로 덮어쓸 수 있습니다(앞이 우선):
  #   GEMINI_MODEL  >  MODEL  >  여기(llm.model)  >  코드 기본값
  # GitHub Actions 는 repository Variable `MODEL`(Settings → Secrets and variables
  # → Actions → Variables)을 GEMINI_MODEL 로 넘겨줍니다. 즉 운영 중 모델 교체는
  # 코드나 이 파일을 고치지 않고 그 Variable 만 바꾸면 됩니다. 빈 문자열은 '지정
  # 안 함'으로 보고 다음 순위로 넘어갑니다. 실제 사용 모델은 실행 시작 시
  # "LLM 설정 — primary=... " INFO 로그로 확인할 수 있습니다.
  model: "gemini-flash-latest"
  # alias 나 위 모델을 쓸 수 없을 때(404 / NOT_FOUND / 모델 부재 메시지) 이 순서로
  # 넘어갑니다. 인증(401·403)·한도(429)·5xx·타임아웃에서는 넘어가지 않고 기존
  # 재시도·시간예산·서킷 브레이커 정책을 따릅니다.
  # 빈 목록([])으로 두면 대체 없이 model 만 씁니다.
  fallback_models:
    - "gemini-3.6-flash"
    - "gemini-3.5-flash-lite"
  # 요약 문장 수와 문장당 길이 상한(프롬프트 지시)
  lines: 3
  max_line_chars: 90
  # 이보다 짧은 본문은 요약하지 않고 원문 그대로 보여줍니다(요약할 게 없음).
  min_body_chars: 80
  # 모델에 넣을 본문 최대 길이. 초과분은 잘라서 보냅니다.
  max_input_chars: 8000
  # 한 번의 실행에서 요약할 최대 '일반' 게시글 수(무료 티어 일일 한도 보호).
  # 초과분은 요약 없이 원문 발췌로 발송됩니다.
  # 의안(assembly_bill)은 이 상한을 쓰지 않습니다 — 아래 assembly_batch 로 따로 셉니다.
  max_posts: 40
  # 분당 요청 상한(무료 티어 RPM). 이 간격에 맞춰 호출을 벌립니다(0 = 제한 없음).
  rpm: 10
  timeout_sec: 45
  # 429/5xx 재시도 횟수와 초기 대기(초). 대기는 2배씩 늘어납니다.
  max_retries: 2
  retry_backoff_sec: 5
  # 서킷 브레이커 — Gemini 가 통째로 죽었을 때 모든 글에 같은 실패를 반복하며
  # 메일 발송이 지연되는 것을 막습니다. 아래 둘 중 하나에 걸리면 남은 글은
  # 호출 없이 원문 발췌로 넘어갑니다(0 = 제한 없음).
  max_consecutive_failures: 3
  # 요약 단계 전체 시간예산(초). 개별 요청은 단조시계 마감으로 강제 중단되고
  # 재시도 대기도 남은 예산 안으로 잘리므로, 이 값이 요약 단계 소요시간의
  # 실질 상한이 됩니다(응답을 조금씩 흘려보내는 서버에도 적용).
  budget_sec: 240

  # ----- 의안(계류의안) 전용 배치 요약 -------------------------------------
  # 계류의안은 하루에도 수십 건이 새로 올라와 1건당 1회로는 무료 티어 한도를 곧바로
  # 태웁니다. 그래서 의안만 여러 건을 한 요청에 묶어 보냅니다. 위의 일반 설정
  # (max_posts / budget_sec 등)은 일반 게시물에만 적용되고 여기에는 영향이 없습니다.
  # 결과는 배열 순서가 아니라 BILL_ID 로 매핑하며, 검증에 실패한 의안은 요약 없이
  # '제안이유 및 주요내용 발췌'로 발송됩니다.
  assembly_batch:
    enabled: true
    # 한 요청에 담을 최대 의안 수
    batch_size: 25
    # 한 번의 실행에서 요약할 최대 의안 수(초과분은 발췌로 발송).
    # batch_size 25 기준으로 정상 실행이라면 최대 3회 호출이 된다.
    max_bills: 75
    # 의안 1건의 제안이유를 프롬프트에 담을 최대 길이(초과분 절단)
    max_input_chars_per_bill: 20000
    # 한 요청의 입력 총량 상한. batch_size 와 함께 지켜집니다(먼저 걸리는 쪽).
    max_batch_chars: 250000
    # 배치 응답은 의안 수만큼 길어지므로 단건보다 큰 출력 상한이 필요합니다.
    max_output_tokens: 16384
    # 의안 배치 요약 단계 전체 시간예산(초). "이만큼 계속 재시도한다"가 아니라
    # **전체 상한**이다. 25건씩 최대 3개 배치가 각각 request_timeout_sec 만큼의
    # 정상 요청 기회를 갖도록 하는 envelope 다(300 = 90 × 3 + 여유).
    budget_sec: 300
    # 의안 배치 요청 하나에 허용할 시간(초). 지정하지 않으면 위의 llm.timeout_sec(45)를
    # 씁니다. 의안 배치는 25건을 한 번에 보내므로 단건 요약보다 응답이 오래 걸립니다 —
    # 일반 경로의 45초는 그대로 두고 여기만 늘립니다.
    #
    # 배치마다 이 값과 '남은 예산 / 남은 배치 수' 중 작은 쪽을 window 로 배분하므로,
    # 첫 배치가 느려도 뒤 배치가 몇 초짜리 타임아웃으로 시작하지 않습니다.
    request_timeout_sec: 90
    # 응답 생성 타임아웃(ReadTimeout·자체 마감 초과)에서 **같은 요청을 다시 보낼지**.
    #
    # false 가 이번 운영값입니다. 25건짜리 요청이 90초를 넘겼다면 같은 25건을 다시
    # 보내도 또 넘길 뿐이고, 그 사이 뒤 배치에 남겨 둔 시간까지 먹습니다(실제 장애의
    # 증폭 경로였습니다). 연결 실패·5xx 같은 진짜 일시 장애의 재시도는 그대로 유지되고,
    # 실패 종류도 TRANSIENT 그대로라 아래 서킷 브레이커의 의미는 달라지지 않습니다.
    retry_response_timeout: false
    # 의안 배치 요청에만 붙일 thinking 수준(minimal/low/medium/high).
    # 3줄 발췌 요약에 긴 사고 과정은 필요 없고, 기본 사고 지연이 그대로 응답 시간이
    # 됩니다. 지원이 확인된 모델(현재 gemini-3.6-flash 계열)에만 실제로 전송되고,
    # 알 수 없는 모델에는 보내지 않습니다(400 방지). 일반 요약 경로는 영향 없습니다.
    thinking_level: "minimal"
    # 응답에서 빠진 의안이 있으면 그 ID 만 한 번 다시 요청합니다.
    retry_missing_once: true
    # 서킷 브레이커 — 일시 장애(5xx·타임아웃 등)로 배치 호출이 **연속으로** 이만큼
    # 실패하면 남은 배치는 호출하지 않고 발췌로 넘깁니다(0 = 제한 없음).
    #
    # 1 로 두면 첫 배치의 503 하나로 그날 나머지 의안이 전부 발췌가 됩니다. 기본값 2 는
    # "한 번은 더 두드려 보고, 그것도 실패하면 Gemini 가 실제로 죽은 것으로 본다"는 뜻입니다.
    # 인증(401/403)·한도(429)·잘못된 요청(400)·모델 부재·프로그램 내부 오류는 다음
    # 배치도 결과가 같으므로 이 카운터와 무관하게 즉시 중단합니다. 반대로 깨진 JSON·
    # 일부 ID 누락·안전필터 차단 같은 '그 배치 내용'의 문제는 여기 세지 않습니다
    # (다음 배치는 통과할 수 있음).
    max_consecutive_transient_failures: 2

# -------------------------------------------------------------------------
# 모니터링 대상. 각 항목의 type 에 따라 src/scrapers 의 파서가 선택됩니다.
# enabled: false 로 두면 해당 소스를 건너뜁니다.
# -------------------------------------------------------------------------
sources:
  # ===== 금융위원회 (fsc.go.kr) =====
  - key: fsc_press
    name: "금융위 · 보도자료"
    type: fsc_board
    enabled: true
    list_url: "https://www.fsc.go.kr/no010101"

  - key: fsc_legislation
    name: "금융위 · 입법예고/규정변경예고"
    type: fsc_board
    enabled: true
    list_url: "https://www.fsc.go.kr/po040301"

  # ===== 금융감독원 (fss.or.kr) — eGovFrame 게시판 =====
  - key: fss_press
    name: "금감원 · 보도자료"
    type: fss_board
    enabled: true
    list_url: "https://www.fss.or.kr/fss/bbs/B0000188/list.do?menuNo=200218"

  - key: fss_admin_guidance
    name: "금감원 · 행정지도 예고"
    type: fss_board
    enabled: true
    list_url: "https://www.fss.or.kr/fss/job/admnPrvntc/list.do?menuNo=200491"

  - key: fss_rule_amendment
    name: "금감원 · 세칙 제·개정 예고"
    type: fss_board
    enabled: true
    list_url: "https://www.fss.or.kr/fss/job/lrgRegItnPrvntc/list.do?menuNo=200489"

  - key: fss_sanction
    name: "금감원 · 검사결과 제재"
    type: fss_board
    enabled: true
    list_url: "https://www.fss.or.kr/fss/job/openInfo/list.do?menuNo=200476"

  - key: fss_mgmt_notice
    name: "금감원 · 경영유의사항 등 공시"
    type: fss_board
    enabled: true
    list_url: "https://www.fss.or.kr/fss/job/openInfoImpr/list.do?menuNo=200483"

  # ===== 금융규제·법령해석포털 (better.fsc.go.kr) =====
  - key: better_reply
    name: "금융규제포털 · 법령해석·비조치의견서 회신사례"
    type: better_reply
    enabled: true
    list_url: "https://better.fsc.go.kr/fsc_new/replyCase/TotalReplyList.do?stNo=11&muNo=117&muGpNo=75"

  # ===== 의안정보시스템 (likms.assembly.go.kr) =====
  # 계류의안 목록은 열린국회정보(open.assembly.go.kr) Open API 로 수집합니다.
  # 인증키는 Secret/환경변수 ASSEMBLY_API_KEY 로 주입하세요.
  - key: assembly_bill
    name: "의안정보시스템 · 계류의안"
    type: assembly_bill
    enabled: true
    list_url: "https://likms.assembly.go.kr/bill/bi/bill/state/mooringBillPage.do"
    # 명세서 기준: '법률안 심사 및 처리(계류의안)' 서비스
    #   요청주소 .../portal/openapi/nwbqublzajtcqpdae
    #   출력필드: BILL_ID, BILL_NO, BILL_NAME, PROPOSER, RST_PROPOSER, PROPOSE_DT, LINK_URL 등
    #   (AGE 는 이 서비스의 요청인자가 아니라 보내도 무시됨 — 계류의안만 반환)
    api_endpoint: "https://open.assembly.go.kr/portal/openapi"
    api_service: "nwbqublzajtcqpdae"
    page_size: 100
    # 이 소스에만 적용하는 신규 상한. 지정하지 않으면 전역 fetch.max_new_per_source(50).
    #
    # 전역 50 은 '어느 게시판이든 갑자기 수백 건이 잡히면 비정상'이라는 안전장치라
    # 낮게 유지합니다. 반면 계류의안은 대량 등록일에 하루 60건대가 정상이라 같은
    # 상한을 쓰면 매번 잘려 나갑니다. 그래서 의안만 75 로 올립니다
    # (llm.assembly_batch.max_bills 와 같은 값 = 25건씩 최대 3배치).
    max_new_per_run: 75
    # 상세 수집 단계 전체 시간예산(초). 코드 기본값은 120 이지만, 신규 상한이 75 로
    # 늘어난 만큼 정상 실행이 예산에 걸려 잘리지 않도록 운영 설정에서 360 을 택합니다.
    # 이 값은 **상한**입니다 — 정상 실행이 무조건 360초를 기다리지 않습니다.
    detail_budget_sec: 360
    # 상세 수집 단계 안전장치(기본값은 코드에 있으므로 평소에는 지정할 필요가 없습니다).
    #
    # 사이트나 billInfo.do 가 통째로 죽으면 신규 의안 하나하나가 (타임아웃 × 재시도)를
    # 각자 다시 겪습니다. max_new_per_source 가 50 이라 상세 단계만 수십 분을 먹고,
    # 그만큼 다이제스트가 늦어지며 다음 15분 주기 실행까지 밀립니다. 둘 중 하나라도
    # 걸리면 남은 의안은 **요청 없이** ERROR 로 떨어뜨립니다(발송은 그대로 진행).
    #
    # 등록 대기(PENDING)는 실패로 세지 않습니다 — 갓 접수된 의안이 몰린 날
    # 브레이커가 헛돌면 안 되기 때문입니다. 0 으로 두면 해당 장치를 끕니다.
    # detail_max_consecutive_failures: 5     # 연속 실패 상한
    # detail_budget_sec: 120                 # 상세 단계 전체 시간예산(초)
    #
    # ----- 상세 재조회 큐(제안이유 등록 대기/수집 실패 의안) -------------------
    #
    # 최초 알림 시점에 제안이유가 아직 등록되지 않았거나(PENDING) 수집이 실패한
    # (ERROR/UNKNOWN) 의안은 seen 으로 확정되는 **동시에** state 의 pending_detail
    # 큐에 남습니다. 이후 실행에서 저장된 BILL_ID/상세 URL 로 상세만 다시 조회하고,
    # 제안이유가 확인되면 '신규'가 아니라 '의안 상세 업데이트'로 한 번 알립니다.
    #
    # 큐가 오래 유지될 때 매 실행(15분)마다 무제한으로 재호출하지 않도록 두 가지
    # 상한을 둡니다. 기본값은 코드(src/scrapers/assembly.py)에 있으므로 평소에는
    # 지정할 필요가 없습니다.
    #
    #   detail_retry_interval_sec  같은 의안을 다시 시도하기 전 최소 간격(초).
    #                              0 이면 매 실행 재시도를 허용합니다.
    #   detail_retry_max_per_run   한 번의 실행에서 처리할 기존 큐 항목 최대 수.
    #                              0 이면 건수 상한이 없습니다(그래도 위의
    #                              detail_budget_sec / 연속실패 브레이커는 적용됩니다).
    #
    # 처리 순서는 결정적입니다(마지막 시도가 오래된 것 먼저). 큐는 자동으로 만료·
    # 삭제되지 않습니다 — 오래 남은 항목은 경고 로그로 드러냅니다.
    # detail_retry_interval_sec: 1800        # 같은 의안 재시도 최소 간격(초)
    # detail_retry_max_per_run: 10           # 한 실행에서 처리할 큐 항목 최대 수
    # 상세 URL 템플릿(기본값은 코드에 있으므로 평소에는 지정할 필요가 없습니다).
    #
    # 라이브 검증 완료(2026-08):
    #   - 현재 상세 경로는 /bill/bi/billDetailPage.do?billId=... 이고 HTTP 200 입니다.
    #   - Open API 의 LINK_URL 은 아직 구 경로 /bill/billDetail.do 를 돌려주는데, 최신
    #     의안에서 그 경로는 "해당 의안 정보가 존재하지 않습니다"를 응답합니다
    #     (redirect 없음). 그래서 스크래퍼가 BILL_ID 로 현재 경로를 다시 만듭니다
    #     (canonicalize). 우리가 모르는 다른 상세 경로가 오면 그대로 존중합니다.
    #
    # 사이트가 경로를 또 옮기면 코드 수정 없이 아래 한 줄로 덮어쓸 수 있습니다.
    # detail_url: "https://likms.assembly.go.kr/bill/bi/billDetailPage.do?billId={bill_id}"
