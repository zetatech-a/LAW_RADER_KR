name: Verify summaries

on:
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'config.yaml'
      - 'scripts/check_gemini.py'
      - '.github/workflows/summary-check.yml'
  push:
    branches: ['codex/fix-gemini-summary-20261001']
  workflow_dispatch:
    inputs:
      live:
        description: '메일 없이 Gemini 실제 연결도 확인'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest -q
  gemini:
    if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.live) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Gemini connection check (no email or state writes)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.MODEL }}
        run: python scripts/check_gemini.py
