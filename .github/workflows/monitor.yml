name: LAW RADAR KR monitor

# 실행 시각(KST 09:07–18:07, 월~금, 15분 간격)
# GitHub Actions cron 은 UTC 기준. KST = UTC+9.
#   09:07–17:52 KST  → 00:07–08:52 UTC  :  '7,22,37,52 0-8 * * 1-5'
#   18:07 KST        → 09:07 UTC        :  '7 9 * * 1-5'
# 정시(:00)·반시(:30)는 전 세계 워크플로가 몰려 지연·스킵이 잦으므로 한산한 분으로
# 오프셋을 준다. GitHub 예약 실행은 밀리거나 아예 스킵될 수 있어(무보장) 간격을
# 15분으로 좁혀, 한 슬롯이 스킵돼도 곧 다음 기회가 오도록 한다.
on:
  schedule:
    - cron: "7,22,37,52 0-8 * * 1-5"
    - cron: "7 9 * * 1-5"
  workflow_dispatch: {}   # 수동 실행 버튼

# state/seen.json 을 커밋해 저장소에 신규 판별 기준을 유지
permissions:
  contents: write

concurrency:
  group: law-rader-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run monitor
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          ASSEMBLY_API_KEY: ${{ secrets.ASSEMBLY_API_KEY }}
        run: python -m src.main

      # 모니터가 실패·취소되더라도 그때까지 기록된 기준선/신규 상태를 저장소에 반영해,
      # 다음 실행이 '최초 실행'을 반복하지 않도록 항상 커밋한다.
      - name: Commit updated state
        if: always()
        run: |
          if [[ -n "$(git status --porcelain state/)" ]]; then
            git config user.name  "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add state/
            git commit -m "chore: update monitor state [skip ci]"
            git push
          else
            echo "state 변경 없음"
          fi
