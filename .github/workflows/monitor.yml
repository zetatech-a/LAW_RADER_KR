name: LAW RADAR KR monitor

# 실행 시각(KST 09:00–18:00, 월~금, 30분 간격)
# GitHub Actions cron 은 UTC 기준. KST = UTC+9.
#   09:00–17:30 KST  → 00:00–08:30 UTC  :  '0,30 0-8 * * 1-5'
#   18:00 KST        → 09:00 UTC        :  '0 9 * * 1-5'
# 참고: GitHub 의 예약 실행은 부하에 따라 수 분 지연될 수 있습니다.
on:
  schedule:
    - cron: "0,30 0-8 * * 1-5"
    - cron: "0 9 * * 1-5"
  workflow_dispatch: {}   # 수동 실행 버튼

# state/seen.json 을 커밋해 저장소에 신규 판별 기준을 유지
permissions:
  contents: write

concurrency:
  group: law-rader-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run monitor
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          ASSEMBLY_API_KEY: ${{ secrets.ASSEMBLY_API_KEY }}
        run: python -m src.main

      # 모니터가 실패·취소되더라도 그때까지 기록된 기준선/신규 상태를 저장소에 반영해,
      # 다음 실행이 '최초 실행'을 반복하지 않도록 항상 커밋한다.
      - name: Commit updated state
        if: always()
        run: |
          if [[ -n "$(git status --porcelain state/)" ]]; then
            git config user.name  "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add state/
            git commit -m "chore: update monitor state [skip ci]"
            git push
          else
            echo "state 변경 없음"
          fi
