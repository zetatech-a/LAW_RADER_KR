name: LAW RADER KR monitor

# Cloudflare 실운영 검증 전 임시 fallback이며, 검증 후 별도 커밋에서 제거할 예정입니다.
run-name: >-
  LAW RADER KR monitor (${{ inputs.trigger_source || github.event_name }} / ${{ inputs.scheduled_for || 'unscheduled' }})

on:
  schedule:
    - cron: "7,22,37,52 0-8 * * 1-5"
    - cron: "7 9 * * 1-5"
  workflow_dispatch:
    inputs:
      trigger_source:
        description: "워크플로 실행 요청 출처"
        required: false
        default: "manual"
        type: string
      scheduled_for:
        description: "외부 스케줄러 기준 실행 예정 시각"
        required: false
        type: string
      cron_expression:
        description: "실행에 사용된 Cron 표현식"
        required: false
        type: string

# state/seen.json 을 커밋해 저장소에 신규 판별 기준을 유지
permissions:
  contents: write

concurrency:
  group: law-rader-monitor
  cancel-in-progress: false

jobs:
  monitor:
    if: ${{ github.event_name != 'schedule' || vars.CLOUDFLARE_SCHEDULER_ENABLED != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Log trigger metadata
        env:
          EVENT_NAME: ${{ github.event_name }}
          TRIGGER_SOURCE: ${{ inputs.trigger_source || github.event_name }}
          SCHEDULED_FOR: ${{ inputs.scheduled_for || 'not-provided' }}
          CRON_EXPRESSION: ${{ inputs.cron_expression || 'not-provided' }}
        run: |
          echo "event_name=${EVENT_NAME}"
          echo "trigger_source=${TRIGGER_SOURCE}"
          echo "scheduled_for=${SCHEDULED_FOR}"
          echo "cron_expression=${CRON_EXPRESSION}"
          echo "job_started_at=$(date -u +'%Y-%m-%dT%H:%M:%SZ')"

      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run monitor
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          ASSEMBLY_API_KEY: ${{ secrets.ASSEMBLY_API_KEY }}
          # 본문 3줄 요약용. 없으면 요약을 건너뛰고 원문 발췌로 발송된다.
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # 사용할 Gemini 모델. Settings → Secrets and variables → Actions →
          # Variables 의 repository Variable `MODEL` 이 그대로 primary 모델이 된다.
          # 비어 있으면 config.yaml 의 llm.model 로 자동으로 되돌아간다
          # (precedence: GEMINI_MODEL > MODEL > config.yaml > 코드 기본값).
          # 이 Variable 은 '유일한 출처'가 아니라 운영 환경의 **override** 다 —
          # config.yaml 의 llm.model 과 코드 기본값, 404 용 fallback_models 는
          # 그대로 남아 있어 Variable 을 지워도 요약이 멈추지 않는다.
          # 다만 워크플로 자체에는 모델명을 적지 않는다(운영 중 교체는 Variable 로).
          GEMINI_MODEL: ${{ vars.MODEL }}
        run: python -m src.main

      # 모니터가 실패·취소되더라도 그때까지 기록된 기준선/신규 상태를 저장소에 반영해,
      # 다음 실행이 '최초 실행'을 반복하지 않도록 항상 커밋한다.
      - name: Commit updated state
        if: always()
        run: |
          if [[ -n "$(git status --porcelain state/)" ]]; then
            git config user.name  "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add state/
            git commit -m "chore: update monitor state [skip ci]"
            git push
          else
            echo "state 변경 없음"
          fi
