name: Verify sources (live)

# 라이브 검증 전용 워크플로우.
# 대상 사이트 파서/페이지 파라미터가 실제로 동작하는지 GitHub 러너에서 확인한다.
# 메일을 보내지 않고 state 도 바꾸지 않으며, 결과 로그와 debug/ 원본 HTML 을
# 아티팩트로 업로드한다. Actions 탭에서 "Run workflow" 로 수동 실행.
on:
  workflow_dispatch:
    inputs:
      only:
        description: "특정 소스만 검증(쉼표구분 key, 비우면 전체)"
        required: false
        default: ""
      capture_bill_id:
        description: "의안 상세 fixture 캡처용 BILL_ID(비우면 캡처 생략)"
        required: false
        default: ""
      capture_bill_url:
        description: "의안 상세 URL 직접 지정(입력하면 BILL_ID 보다 우선)"
        required: false
        default: ""

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt pytest

      # 입력값은 env 로 넘긴다. run 블록에 ${{ }} 를 직접 끼워 넣으면 입력 문자열이
      # 셸 스크립트로 해석될 수 있다(script injection).
      - name: Run verification
        shell: bash
        env:
          ASSEMBLY_API_KEY: ${{ secrets.ASSEMBLY_API_KEY }}
          ONLY: ${{ inputs.only }}
        run: |
          python scripts/verify_sources.py --only "$ONLY" | tee verify_report.txt

      # 의안 상세('제안이유 및 주요내용') 수집 경로의 라이브 검증.
      # 개발 환경에서 likms.assembly.go.kr 접속이 막힌 경우 여기서 한 번 캡처해
      # tests/fixtures/ 에 커밋하면 이후에는 네트워크 없이 회귀 테스트가 돈다.
      # 결과 JSON 에 최종 URL·redirect·form 필드명·CSRF 전달 방식이 기록된다.
      #
      # 스크립트는 제안이유를 확보하지 못하면 exit 2 로 끝난다. shell: bash 가
      # pipefail 을 켜므로 tee 를 거쳐도 그 종료코드가 그대로 job 실패로 이어진다.
      #
      # 앞 단계(verify_sources)가 실패해도 캡처는 시도한다 — 다른 소스가 깨진 것과
      # 의안 상세 확인은 별개이고, 이 워크플로를 도는 목적이 캡처인 경우가 많다.
      - name: Capture assembly detail fixture
        id: capture
        if: ${{ !cancelled() && (inputs.capture_bill_url != '' || inputs.capture_bill_id != '') }}
        shell: bash
        env:
          BILL_ID: ${{ inputs.capture_bill_id }}
          BILL_URL: ${{ inputs.capture_bill_url }}
        run: |
          if [ -n "$BILL_URL" ]; then
            python scripts/capture_assembly_fixture.py --url "$BILL_URL" \
              | tee capture_report.txt
          else
            python scripts/capture_assembly_fixture.py --bill-id "$BILL_ID" \
              | tee capture_report.txt
          fi

      # 캡처 직후, 방금 받은 실제 응답으로 상세 수집 경로를 검증한다.
      # 캡처가 성공했다면 fixture 가 있으므로 skip 이 0 이어야 한다 — skip 이 남으면
      # fixture 가 제대로 생성되지 않은 것이므로 실패로 잡는다.
      - name: Test against captured fixture
        if: ${{ steps.capture.outcome == 'success' }}
        shell: bash
        run: |
          python -m pytest tests/test_assembly_fixture.py -q -rs \
            | tee fixture_test_report.txt
          if grep -q "skipped" fixture_test_report.txt; then
            echo "::error::캡처 후에도 fixture 테스트가 skip 되었습니다 — fixture 생성 실패"
            exit 1
          fi

      # 실패해도 진단 자료는 반드시 남긴다(가장 필요한 순간이다).
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: verify-results
          path: |
            verify_report.txt
            capture_report.txt
            fixture_test_report.txt
            debug/
            tests/fixtures/
          if-no-files-found: warn
          retention-days: 7
