name: Verify sources (live)

# 라이브 검증 전용 워크플로우.
# 대상 사이트 파서/페이지 파라미터가 실제로 동작하는지 GitHub 러너에서 확인한다.
# 메일을 보내지 않고 state 도 바꾸지 않으며, 결과 로그와 debug/ 원본 HTML 을
# 아티팩트로 업로드한다. Actions 탭에서 "Run workflow" 로 수동 실행.
on:
  workflow_dispatch:
    inputs:
      only:
        description: "특정 소스만 검증(쉼표구분 key, 비우면 전체)"
        required: false
        default: ""
      capture_bill_id:
        description: "의안 상세 fixture 캡처용 BILL_ID(비우면 캡처 생략)"
        required: false
        default: ""

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run verification
        env:
          ASSEMBLY_API_KEY: ${{ secrets.ASSEMBLY_API_KEY }}
        run: |
          python scripts/verify_sources.py --only "${{ github.event.inputs.only }}" \
            | tee verify_report.txt

      # 의안 상세('제안이유 및 주요내용') 수집 경로의 라이브 검증.
      # 개발 환경에서 likms.assembly.go.kr 접속이 막힌 경우 여기서 한 번 캡처해
      # tests/fixtures/ 에 커밋하면 이후에는 네트워크 없이 회귀 테스트가 돈다.
      # 결과 JSON 에 최종 URL·redirect·form 필드명·CSRF 전달 방식이 기록된다.
      - name: Capture assembly detail fixture
        if: inputs.capture_bill_id != ''
        run: |
          python scripts/capture_assembly_fixture.py \
            --bill-id "${{ inputs.capture_bill_id }}" | tee capture_report.txt

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: verify-results
          path: |
            verify_report.txt
            capture_report.txt
            debug/
            tests/fixtures/
          if-no-files-found: warn
          retention-days: 7
