name: Capture better_reply detail DOM (temporary diagnostic)

# 임시 진단 워크플로우. 회신사례 상세 페이지의 실제 DOM 을 확보하기 위한 것이며,
# 파서 수정이 끝나면 삭제한다. 메일을 보내지 않고 state 도 바꾸지 않는다.
on:
  workflow_dispatch:
    inputs:
      idx:
        description: "lawreqIdx (쉼표구분)"
        required: false
        default: "5449,5450"
  push:
    branches:
      - claude/financial-regulation-portal-fix-p8dwmz
    paths:
      - "scripts/capture_better_reply_detail.py"
      - ".github/workflows/capture-reply-dom.yml"

concurrency:
  group: capture-reply-dom
  cancel-in-progress: true

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    # better.fsc.go.kr 도달성은 러너 IP 마다 다르다(같은 시각에 어떤 러너는 붙고 어떤
    # 러너는 connect timeout). 러너를 여러 개 띄워 하나라도 붙으면 DOM 을 확보한다.
    strategy:
      fail-fast: false
      matrix:
        runner: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Capture
        env:
          IDX: ${{ inputs.idx || '5449,5450' }}
        run: |
          args=()
          IFS=',' read -ra idxs <<< "$IDX"
          for i in "${idxs[@]}"; do args+=(--idx "$(echo "$i" | xargs)"); done
          python scripts/capture_better_reply_detail.py "${args[@]}" \
            --expect-title "여신전문금융회사가 신기술사업자에 투자하는 경우 금리인하요구권 안내의무 적용 여부" \
            --expect-title "신기술사업금융업자의 글로벌펀드(외국법에 따른 외국펀드) 결성·운용 가능여부" \
            | tee reply_capture_report.txt
      - name: Upload
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reply-dom-capture-${{ matrix.runner }}
          path: |
            reply_capture_report.txt
            debug/
          if-no-files-found: warn
          retention-days: 7
